# EasyTPA — English (en)
prefix: "&b[EasyTPA] &r"
# Request
request-sent: "&aRequest sent to &e{target}&a."
request-received: "&e{requester} &7wants to teleport to you. &a/tpaccept &7or &c/tpdeny"
request-received-hover: "&7Click to accept"
already-has-request: "&cYou already have a pending request."
target-has-request: "&c{target} already has a pending request."
no-request: "&cNo pending request."
request-expired: "&cRequest expired."
# Teleport
accepted: "&aAccepted. Teleporting &e{player}&a..."
denied: "&cDenied."
teleported: "&aTeleported!"
teleport-delay: "&7Teleporting in &e{seconds}s&7... Don't move!"
teleport-cancelled-move: "&cTeleport cancelled — you moved!"
cooldown: "&cWait &e{seconds}s &cbefore next request."
blocked: "&c{target} is not accepting requests."
whitelist-only: "&c{target} only accepts whitelisted requests."
# Settings
settings-header: "&b[EasyTPA] &7autoAccept=&e{autoAccept} &7mode=&e{mode} &7whitelist=&e{whitelist}"
settings-autoAccept-on: "&aAuto-accept enabled."
settings-autoAccept-off: "&cAuto-accept disabled."
settings-mode-set: "&aMode set to &e{mode}&a."
settings-whitelist-on: "&aWhitelist enabled."
settings-whitelist-off: "&cWhitelist disabled."
settings-status: "&7Status: autoAccept=&e{autoAccept} &7mode=&e{mode} &7whitelist=&e{whitelist}"
# Whitelist
whitelist-added: "&aAdded &e{player} &ato whitelist."
whitelist-removed: "&aRemoved &e{player} &afrom whitelist."
whitelist-already: "&cAlready whitelisted."
whitelist-not-found: "&cNot in whitelist."
whitelist-empty: "&7Whitelist empty — everyone can send (unless mode=BLOCK)."
whitelist-list-header: "&bWhitelist &7({size}):"
whitelist-list-entry: "&7- &e{player} &7({uuid})"
# Errors
only-players: "&cOnly players can use this."
player-not-found: "&cPlayer not found: &e{player}"
self-request: "&cYou can't send a request to yourself."
no-permission: "&cNo permission."
usage-tpa: "&cUsage: /tpa <player>"
usage-tpasettings: "&cUsage: /tpasettings <autoAccept|mode|whitelist|status> [value]"
usage-whitelist: "&cUsage: /tpawhitelist <add|remove|list> [player]"
# Sounds are handled via config tpa.sound.* — messages here are text only
